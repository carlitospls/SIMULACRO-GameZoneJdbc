<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Juegos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="contenedor">
    <div class="cabecera">
        <h1>Juegos</h1>
        <a th:href="@{/juegos/nuevo}" class="boton verde">+ Añadir juego</a>
    </div>

    <div th:replace="~{fragments/layout :: alertas}"></div>

    <table>
        <thead>
        <tr>
            <th>Código</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Plataforma</th>
            <th>Año</th>
            <th>Editar</th>
            <th>Borrar</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(juegos)}">
            <td colspan="7" class="suave">No hay juegos</td>
        </tr>
        <tr th:each="p : ${juegos}">
            <td th:text="${p.codigo}">1</td>
            <td th:text="${p.nombre}">Nombre</td>
            <td th:text="${#numbers.formatDecimal(p.precio, 1, 2, 'POINT')} + ' €'">0.00</td>
            <td th:text="${p.plataforma.nombre}">Plataforma</td>
            <td th:text="${p.getAño()}">Año</td>
            <td>
                <a th:href="@{/juegos/editar/{codigo}(codigo=${p.codigo})}" class="boton amarillo">Editar</a>
            </td>
            <td>
                <form th:action="@{/juegos/borrar/{codigo}(codigo=${p.codigo})}" method="post"
                      onsubmit="return confirm('¿Seguro que quieres borrar este juego?');">
                    <button type="submit" class="boton rojo">Borrar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
